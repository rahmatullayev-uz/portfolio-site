<header class="sticky top-0 z-50 w-full border-b border-zinc-200/80 dark:border-zinc-800/80 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md transition-colors duration-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Brand Logo -->
            <div class="flex-shrink-0">
                <a href="{% url 'pages:home' %}" class="flex items-center gap-2 group">
                    <span class="w-8 h-8 rounded-lg bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-mono font-bold flex items-center justify-center border border-emerald-500/20 group-hover:scale-105 transition-transform">
                        R
                    </span>
                    <span class="text-lg font-bold tracking-tight text-zinc-900 dark:text-white">
                        rahmatullayev<span class="text-emerald-500">.uz</span>
                    </span>
                </a>
            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center gap-1 sm:gap-2">
                <a href="{% url 'pages:home' %}" class="px-3 py-2 text-sm font-medium rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800/60 {% if request.resolver_match.url_name == 'home' %}text-emerald-600 dark:text-emerald-400 font-semibold{% endif %}">
                    Bosh sahifa
                </a>
                <a href="{% url 'pages:about' %}" class="px-3 py-2 text-sm font-medium rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800/60 {% if request.resolver_match.url_name == 'about' %}text-emerald-600 dark:text-emerald-400 font-semibold{% endif %}">
                    Men haqimda
                </a>
                <a href="{% url 'projects:list' %}" class="px-3 py-2 text-sm font-medium rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800/60 {% if request.resolver_match.app_name == 'projects' %}text-emerald-600 dark:text-emerald-400 font-semibold{% endif %}">
                    Loyihalar
                </a>
                <a href="{% url 'blog:list' %}" class="px-3 py-2 text-sm font-medium rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800/60 {% if request.resolver_match.app_name == 'blog' %}text-emerald-600 dark:text-emerald-400 font-semibold{% endif %}">
                    Blog
                </a>
                <a href="{% url 'contact:contact' %}" class="px-3 py-2 text-sm font-medium rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800/60 {% if request.resolver_match.app_name == 'contact' %}text-emerald-600 dark:text-emerald-400 font-semibold{% endif %}">
                    Bog'lanish
                </a>
            </nav>

            <!-- Actions (Theme Toggle & CTA) -->
            <div class="flex items-center gap-3">
                <!-- Theme Switcher Button -->
                <button type="button" class="theme-toggle-btn p-2 rounded-lg text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 focus:outline-none transition-colors" aria-label="Mavzuni almashtirish">
                    <!-- Sun Icon (Dark modeda ko'rinadi) -->
                    <svg class="theme-icon-sun w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon Icon (Light modeda ko'rinadi) -->
                    <svg class="theme-icon-moon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Mobile Menu Button -->
                <div class="flex md:hidden">
                    <button type="button" id="mobile-menu-btn" class="p-2 rounded-lg text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 focus:outline-none" aria-label="Mobil menyu">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 px-4 pt-2 pb-4 space-y-1">
        <a href="{% url 'pages:home' %}" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            Bosh sahifa
        </a>
        <a href="{% url 'pages:about' %}" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            Men haqimda
        </a>
        <a href="{% url 'projects:list' %}" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            Loyihalar
        </a>
        <a href="{% url 'blog:list' %}" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            Blog
        </a>
        <a href="{% url 'contact:contact' %}" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            Bog'lanish
        </a>
    </div>
</header>
